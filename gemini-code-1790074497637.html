<body class="h-full text-slate-800 flex flex-col md:flex-row min-h-screen">

    <!-- Sidebar Navigation -->

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
        <!-- Top Bar -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between">

            </div>

        <!-- Dynamic Content Body -->
        <div id="main-content" class="p-6">

    <!-- Modals -->
    <!-- Role Switch Modal -->
    <div id="role-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 border border-slate-100">
            <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">

            </h3>
            <div class="space-y-3">
                <button onclick="window.selectRole('student')" class="w-full text-left p-3 rounded-lg border border-slate-200 hover:border-blue-500 hover:bg-blue-50 transition flex items-center justify-between">
                    <div>
                        <div class="font-bold text-slate-800">นักเรียน</div>

                <button onclick="window.promptPasscode('teacher')" class="w-full text-left p-3 rounded-lg border border-slate-200 hover:border-blue-500 hover:bg-blue-50 transition flex items-center justify-between">

                <button onclick="window.promptPasscode('cook')" class="w-full text-left p-3 rounded-lg border border-slate-200 hover:border-blue-500 hover:bg-blue-50 transition flex items-center justify-between">

                        <div class="font-bold text-slate-800">แม่ครัว</div>

                <button onclick="window.promptPasscode('council')" class="w-full text-left p-3 rounded-lg border border-slate-200 hover:border-blue-500 hover:bg-blue-50 transition flex items-center justify-between">

                <button onclick="window.promptPasscode('admin')" class="w-full text-left p-3 rounded-lg border border-slate-200 hover:border-blue-500 hover:bg-blue-50 transition flex items-center justify-between">

                        <div class="text-xs text-slate-500">เปลี่ยนรหัสผ่านทุกสิทธิ์ และจัดการระบบ</div>

    <!-- Passcode Modal -->
    <div id="passcode-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full p-6 border border-slate-100">
            <h3 class="text-lg font-bold text-slate-800 mb-2 flex items-center gap-2">

            <input type="password" id="passcode-input" class="w-full p-2.5 border border-slate-300 rounded-lg mb-4 text-center text-lg font-semibold tracking-widest focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••••" onkeyup="if(event.key==='Enter') window.verifyPasscode()">
            <div class="flex gap-2">
                <button onclick="window.closePasscodeModal()" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-semibold">ยกเลิก</button>
                <button onclick="window.verifyPasscode()" class="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold">ยืนยัน</button>

    </div>

    <!-- Student Registration & Login Modals -->
    <div id="student-login-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
            <h3 class="text-lg font-bold text-slate-800 mb-2">เข้าสู่ระบบนักเรียน</h3>
            <p class="text-xs text-slate-500 mb-4">กรอกรหัสนักเรียนของคุณเพื่อเข้าใช้งาน</p>
            <input type="text" id="login-student-id" placeholder="รหัสนักเรียน (เช่น 10001)" class="w-full p-2.5 border rounded-lg mb-4 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            <div class="flex gap-2">
                <button onclick="window.closeModal('student-login-modal')" class="flex-1 py-2 bg-slate-100 text-slate-700 rounded-lg text-sm font-semibold">ยกเลิก</button>
                <button onclick="window.handleStudentLogin()" class="flex-1 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700">เข้าสู่ระบบ</button>
            </div>
            <div class="mt-4 text-center border-t pt-3">
                <span class="text-xs text-slate-500">ยังไม่มีบัญชีนักเรียน? </span>
                <button onclick="window.openStudentRegister()" class="text-xs text-blue-600 font-bold hover:underline">สมัครสมาชิกที่นี่</button>
            </div>
        </div>

    <div id="student-reg-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
            <h3 class="text-lg font-bold text-slate-800 mb-2">สมัครเข้าใช้งานนักเรียน</h3>
            <div class="space-y-3 mb-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">รหัสนักเรียน</label>
                    <input type="text" id="reg-student-id" placeholder="ตัวเลขรหัสนักเรียน" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อ</label>
                        <input type="text" id="reg-first-name" placeholder="ชื่อ" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">นามสกุล</label>
                        <input type="text" id="reg-last-name" placeholder="นามสกุล" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">ชั้นเรียน</label>
                        <select id="reg-class" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">เลขที่</label>
                        <input type="number" id="reg-number" placeholder="เลขที่" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="window.closeModal('student-reg-modal')" class="flex-1 py-2 bg-slate-100 text-slate-700 rounded-lg text-sm font-semibold">ยกเลิก</button>
                <button onclick="window.handleStudentRegister()" class="flex-1 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700">ลงทะเบียน</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Core Logic -->
    <script>
        // --- 1. YOUR PERSONAL FIREBASE DATABASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyBEAeDYDM4i538rsoRWsLA6mgAQVpmnYU8",
            authDomain: "kamhoemschool.firebaseapp.com",
            databaseURL: "https://kamhoemschool-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kamhoemschool",
            storageBucket: "kamhoemschool.firebasestorage.app",
            messagingSenderId: "264583207668",
            appId: "1:264583207668:web:03b041a8627d035c231ca1",
            measurementId: "G-Y83TB5RSNZ"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- 2. CONSTANTS & SYSTEM CONFIGS ---
        const DEFAULT_CLASS_LIST = [
            "ม.1/1", "ม.1/2", "ม.1/3",
            "ม.2/1", "ม.2/2", "ม.2/3",
            "ม.3/1", "ม.3/2", "ม.3/3", "ม.3/4",
            "ม.4/1", "ม.4/2", "ม.4/3",
            "ม.5/1", "ม.5/2", "ม.5/3",
            "ม.6/1", "ม.6/2", "ม.6/3"
        ];

        const SUBJECT_LIST = [
            "ภาษาไทย", "คณิตศาสตร์", "วิทยาศาสตร์", "ภาษาอังกฤษ",
            "สังคมศึกษา", "สุขศึกษาและพลศึกษา", "ศิลปะ", "การงานอาชีพ",
            "คอมพิวเตอร์/เทคโนโลยี", "แนะแนว"
        ];

        const defaultPasscodes = {
            teacher: "teacher123",
            cook: "cook123",
            council: "council123",
            admin: "admin123"
        };

        const defaultPaymentInfo = {
            accountName: "โรงครัวโรงเรียนคำเพิ่มพิทยา (แม่ครัว)",
            accountNo: "089-999-9999",
            qrUrl: "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=PROMPTPAY_KHAMPOEM"
        };

        const ROLE_NAMES = {
            student: "นักเรียน",
            teacher: "คุณครู",
            cook: "แม่ครัว",
            council: "สภานักเรียน",
            admin: "ผู้ดูแลระบบ"
        };

        // App State
        let currentRole = localStorage.getItem('school_user_role') || 'student';
        let loggedStudent = JSON.parse(localStorage.getItem('school_logged_student')) || null;
        let activeTab = '';
        let targetRoleToSwitch = null;

        // Realtime Synchronized State
        let dbState = {
            passcodes: defaultPasscodes,
            paymentInfo: defaultPaymentInfo,
            classList: DEFAULT_CLASS_LIST,
            students: [],
            news: [],
            foods: [],
            orders: [],
            lost: [],
            maintenance: [],
            attendance: {}
        };

        function sortClassRooms(classes) {
            return classes.sort((a, b) => {
                const matchA = a.match(/ม\.(\d+)\/(\d+)/);
                const matchB = b.match(/ม\.(\d+)\/(\d+)/);
                
                if (matchA && matchB) {
                    const levelA = parseInt(matchA[1]);
                    const levelB = parseInt(matchB[1]);
                    if (levelA !== levelB) return levelA - levelB;
                    
                    const roomA = parseInt(matchA[2]);
                    const roomB = parseInt(matchB[2]);
                    return roomA - roomB;
                }
                return a.localeCompare(b, 'th');
            });
        }

        // Navigation Permissions
        const MENU_PERMISSIONS = {
            student: [
                { id: 'canteen', label: 'สั่งจองอาหารล่วงหน้า', icon: 'utensils' },
                { id: 'lost-found', label: 'แจ้งของหายได้คืน', icon: 'search' },
                { id: 'maintenance', label: 'แจ้งซ่อมอุปกรณ์', icon: 'wrench' }
            ],
            council: [
                { id: 'council-news', label: 'ข่าวสภานักเรียน', icon: 'megaphone' },
                { id: 'lost-found', label: 'แจ้งของหายได้คืน', icon: 'search' },
                { id: 'maintenance', label: 'แจ้งซ่อมอุปกรณ์', icon: 'wrench' }
            ],
            teacher: [
                { id: 'attendance', label: 'เช็กชื่อรายวิชา/คาบเรียน', icon: 'clipboard-check' },
                { id: 'student-roster', label: 'จัดการรายชื่อนักเรียน', icon: 'users' },
                { id: 'maintenance', label: 'แจ้งซ่อมอุปกรณ์', icon: 'wrench' }
            ],
            cook: [
                { id: 'canteen', label: 'จัดการเมนู/โควต้า/ออเดอร์', icon: 'utensils' },
                { id: 'maintenance', label: 'แจ้งซ่อมอุปกรณ์', icon: 'wrench' }
            ],
            admin: [
                { id: 'admin-passcodes', label: 'จัดการรหัสผ่านระบบ', icon: 'key' },
                { id: 'attendance', label: 'เช็กชื่อรายวิชา/คาบเรียน', icon: 'clipboard-check' },
                { id: 'council-news', label: 'ข่าวสภานักเรียน', icon: 'megaphone' },
                { id: 'student-roster', label: 'จัดการรายชื่อนักเรียน', icon: 'users' },
                { id: 'canteen', label: 'สั่งอาหาร / จัดการร้านอาหาร', icon: 'utensils' },
                { id: 'lost-found', label: 'แจ้งของหายได้คืน', icon: 'search' },
                { id: 'maintenance', label: 'แจ้งซ่อมอุปกรณ์', icon: 'wrench' }
            ]
        };

        // --- 3. REALTIME DATABASE LISTENERS ---
        function initRealtimeListeners() {
            db.ref('school_data').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val) {
                    dbState.passcodes = val.passcodes || defaultPasscodes;
                    dbState.paymentInfo = val.paymentInfo || defaultPaymentInfo;
                    
                    let loadedClasses = val.classList ? Object.values(val.classList) : DEFAULT_CLASS_LIST;
                    dbState.classList = sortClassRooms(loadedClasses);

                    dbState.students = val.students ? Object.values(val.students) : [];
                    dbState.news = val.news ? Object.values(val.news).reverse() : [];
                    dbState.foods = val.foods ? Object.values(val.foods) : [];
                    dbState.orders = val.orders ? Object.values(val.orders).reverse() : [];
                    dbState.lost = val.lost ? Object.values(val.lost).reverse() : [];
                    dbState.maintenance = val.maintenance ? Object.values(val.maintenance).reverse() : [];
                    dbState.attendance = val.attendance || {};
                } else {
                    db.ref('school_data/passcodes').set(defaultPasscodes);
                    db.ref('school_data/paymentInfo').set(defaultPaymentInfo);
                    db.ref('school_data/classList').set(DEFAULT_CLASS_LIST);
                    db.ref('school_data/foods/101').set({ id: '101', name: "ข้าวมันไก่ต้ม/ไก่ทอด", price: 40, totalStock: 50, category: "อาหารจานเดียว", available: true });
                    db.ref('school_data/foods/102').set({ id: '102', name: "ข้าวผัดกระเพราหมูสับ + ไข่ดาว", price: 45, totalStock: 50, category: "อาหารจานเดียว", available: true });
                    db.ref('school_data/news/1').set({ id: 1, title: "ต้อนรับสู่ระบบบริหารจัดการโรงเรียนคำเพิ่มพิทยา", content: "ระบบเชื่อมโยงแบบเรียลไทม์ออนไลน์ทุกเครื่องเรียบร้อยแล้ว", date: "2026-09-22", author: "ผู้ดูแลระบบ" });
                }

                if (activeTab) {
                    window.switchTab(activeTab);
                }
            });
        }

        // --- 4. APP CONTROLLER FUNCTIONS ---
        window.initApp = function() {
            window.updateRoleUI();
            window.renderSidebar();
            
            const allowedTabs = MENU_PERMISSIONS[currentRole];
            if (allowedTabs && allowedTabs.length > 0) {
                window.switchTab(allowedTabs[0].id);
            }
            lucide.createIcons();
        };

        window.updateRoleUI = function() {
            document.getElementById('current-role-badge').innerText = ROLE_NAMES[currentRole] || currentRole;
            const userElem = document.getElementById('logged-user-name');
            const authContainer = document.getElementById('auth-button-container');

            if (currentRole === 'student') {
                if (loggedStudent) {
                    userElem.innerText = `👤 ${loggedStudent.firstName} ${loggedStudent.lastName} (${loggedStudent.classRoom})`;
                    authContainer.innerHTML = `
                        <button onclick="window.handleStudentLogout()" class="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg flex items-center gap-1">
                            <i data-lucide="log-out" class="w-3.5 h-3.5"></i> ออกจากระบบนักเรียน
                        </button>
                    `;
                } else {
                    userElem.innerText = `👤 ยังไม่ได้เข้าระบบนักเรียน`;
                    authContainer.innerHTML = `
                        <button onclick="window.openModal('student-login-modal')" class="px-3 py-1.5 text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white rounded-lg flex items-center gap-1">
                            <i data-lucide="log-in" class="w-3.5 h-3.5"></i> เข้าสู่ระบบนักเรียน
                        </button>
                    `;
                }
            } else {
                userElem.innerText = `🔐 สิทธิ์: ${ROLE_NAMES[currentRole]}`;
                authContainer.innerHTML = '';
            }
        };

        window.renderSidebar = function() {
            const menuContainer = document.getElementById('sidebar-menu');
            const navItems = MENU_PERMISSIONS[currentRole] || [];

            menuContainer.innerHTML = navItems.map(item => `
                <button onclick="window.switchTab('${item.id}')" id="nav-btn-${item.id}" 
                    class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${activeTab === item.id ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
                    <i data-lucide="${item.icon}" class="w-4 h-4"></i>
                    <span>${item.label}</span>
                </button>
            `).join('');

            lucide.createIcons();

            activeTab = tabId;

            const titleElem = document.getElementById('page-title');

            const currentTabObj = MENU_PERMISSIONS[currentRole].find(t => t.id === tabId);

            const classRoom = document.getElementById('add-class').value;

            if (!id || !firstName || !lastName) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');
            if (dbState.students.some(s => s.id === id)) return alert('รหัสนักเรียนนี้มีอยู่แล้ว');

            const num = dbState.students.filter(s => s.classRoom === classRoom).length + 1;

        window.importStudentFile = function() {
            const fileInput = document.getElementById('student-file-input');
            if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
                return alert('กรุณาเลือกไฟล์ .csv หรือ .txt ก่อนครับ');
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r\n|\n/);
                let importedCount = 0;
                let updates = {};
                let newClassesDetected = new Set(dbState.classList);

                lines.forEach((line, index) => {
                    const trimmedLine = line.trim();
                    if (!trimmedLine) return;

                    let parts = trimmedLine.split(/[,;\t]/).map(p => p.trim());
                    if (index === 0 && (parts[0].includes('รหัส') || parts[1].includes('ชื่อ'))) return;

                    if (parts.length >= 3) {
                        const id = parts[0];
                        let fullName = parts[1];
                        let lastName = parts[2] || '';
                        let classRoom = parts[3] || 'ม.1/1';
                        let number = parts[4] ? parseInt(parts[4]) : (index + 1);

                        fullName = fullName.replace(/^(เด็กชาย|เด็กหญิง|นาย|นางสาว)/g, '').trim();

                        if (classRoom && !classRoom.startsWith('ม.')) {
                            classRoom = 'ม.' + classRoom;
                        }

                        newClassesDetected.add(classRoom);

                        if (id && fullName) {
                            updates[`school_data/students/${id}`] = {
                                id: id,
                                firstName: fullName,
                                lastName: lastName,
                                classRoom: classRoom,
                                number: number
                            };
                            importedCount++;
                        }
                    }
                });

                if (importedCount > 0) {
                    updates['school_data/classList'] = sortClassRooms(Array.from(newClassesDetected));

                    db.ref().update(updates)
                        .then(() => {
                            alert(`นำเข้าไฟล์สำเร็จ! เพิ่มรายชื่อนักเรียนจำนวน ${importedCount} คน พร้อมจัดเรียงห้องเรียนเรียบร้อยแล้ว`);
                            fileInput.value = '';
                        })
                        .catch((err) => {
                            alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล: ' + err.message);
                        });
                } else {
                    alert('ไม่พบข้อมูลที่ถูกต้องในไฟล์ กรุณาตรวจสอบว่ามี รหัสนักเรียน, ชื่อ, นามสกุล และห้องเรียน');
                }
            };

            reader.readAsText(file, 'UTF-8');
        };

            if (!name || isNaN(price)) return alert('กรุณากรอกชื่อเมนูและราคาให้ถูกต้อง');

            db.ref('school_data/paymentInfo').set({ accountName, accountNo, qrUrl });

        window.addToCart = function(foodId) {
            const food = dbState.foods.find(f => f.id == foodId);
            if (!food) return;

            let orderedCount = 0;
            dbState.orders.forEach(o => {
                o.items.forEach(item => {
                    if (item.id == foodId) {
                        orderedCount += item.qty;
                    }
                });
            });
            const remaining = Math.max(0, (food.totalStock || 0) - orderedCount);

            const existing = cart.find(c => c.id == foodId);
            const currentQtyInCart = existing ? existing.qty : 0;

            if (currentQtyInCart + 1 > remaining) {
                return alert(`ขออภัย เมนู "${food.name}" เหลือจำนวนจำกัดเพียง ${remaining} จานเท่านั้นครับ`);
            }

            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...food, qty: 1 });
            }
            window.renderCart();
        };

        window.changeCartQty = function(foodId, delta) {
            const existing = cart.find(c => c.id == foodId);
            if (!existing) return;

            if (delta > 0) {
                const food = dbState.foods.find(f => f.id == foodId);
                let orderedCount = 0;
                dbState.orders.forEach(o => {
                    o.items.forEach(item => {
                        if (item.id == foodId) orderedCount += item.qty;
                    });
                });
                const remaining = Math.max(0, (food.totalStock || 0) - orderedCount);

                if (existing.qty + 1 > remaining) {
                    return alert(`ขออภัย เมนูนี้เหลือจำกัดเพียง ${remaining} จานเท่านั้น`);
                }
                existing.qty++;
            } else {
                existing.qty--;
                if (existing.qty <= 0) {
                    cart = cart.filter(c => c.id != foodId);
                }
            }
            window.renderCart();
        };

        window.removeFromCart = function(foodId) {
            cart = cart.filter(c => c.id != foodId);
            window.renderCart();
        };

        window.renderCart = function() {
            const container = document.getElementById('cart-items');
            const totalElem = document.getElementById('cart-total');
            if (!container || !totalElem) return;

            if (cart.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">ยังไม่มีสินค้าในตะกร้า</p>';
                totalElem.innerText = '฿0';
                return;
            }

            let total = 0;
            container.innerHTML = cart.map(item => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                return `
                    <div class="flex justify-between items-center text-xs p-2 bg-slate-50 rounded border">
                        <div class="space-y-0.5">
                            <div class="font-bold text-slate-800">${item.name}</div>
                            <div class="text-slate-500">฿${item.price} x ${item.qty} = <strong>฿${subtotal}</strong></div>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="window.changeCartQty('${item.id}', -1)" class="w-6 h-6 bg-white border rounded flex items-center justify-center font-bold text-slate-600 hover:bg-slate-200">-</button>
                            <span class="font-bold w-4 text-center">${item.qty}</span>
                            <button onclick="window.changeCartQty('${item.id}', 1)" class="w-6 h-6 bg-white border rounded flex items-center justify-center font-bold text-slate-600 hover:bg-slate-200">+</button>
                            <button onclick="window.removeFromCart('${item.id}')" class="p-1 text-red-600 hover:bg-red-100 rounded ml-1" title="ลบออกจากตะกร้า">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
            totalElem.innerText = `฿${total}`;
            lucide.createIcons();
        };

        window.submitOrder = function() {
            if (!loggedStudent) return alert('กรุณาเข้าสู่ระบบนักเรียนที่มุมบนซ้ายก่อนทำการสั่งอาหารครับ');
            if (cart.length === 0) return alert('กรุณาเลือกอาหารลงตะกร้าก่อน');
            
            const pickupTime = document.getElementById('pickup-time')?.value;
            const orderNote = document.getElementById('order-note')?.value.trim();
            const slipInput = document.getElementById('slip-file');

            if (!pickupTime) return alert('กรุณาระบุเวลารับอาหาร');
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const customerName = `${loggedStudent.firstName} ${loggedStudent.lastName} (${loggedStudent.classRoom})`;
            const orderId = Date.now().toString();

            db.ref(`school_data/orders/${orderId}`).set({
                id: orderId,
                studentId: loggedStudent.id,
                customer: customerName,
                items: [...cart],
                total: total,
                pickupTime: pickupTime,
                note: orderNote || 'ไม่มีรายละเอียดเพิ่มเติม',
                slip: slipInput?.files?.length > 0 ? true : false,
                status: 'PENDING'

            cart = [];
            alert('ส่งออเดอร์สำเร็จ! ติดตามสถานะได้ที่กล่องด้านบน');
            window.renderCanteenTab(document.getElementById('main-content'));

                location,
                date: new Date().toISOString().split('T')[0],
                reporter: reporterName,
                status: 'กำลังตามหา'
            });
        };

        window.markLostItemReturned = function(id) {
            db.ref(`school_data/lost/${id}/status`).set('คืนแล้ว');
        };

        // ==================== TAB 6: Maintenance ====================
        window.renderMaintenanceTab = function(container) {
            const canManage = ['teacher', 'admin'].includes(currentRole);

            container.innerHTML = `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2">
                            <i data-lucide="wrench" class="text-blue-600"></i> แจ้งซ่อมอุปกรณ์ / อาคารสถานที่
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                            <input type="text" id="maint-title" placeholder="อุปกรณ์ที่ชำรุด (เช่น พัดลม, หลอดไฟ)" class="p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                            <input type="text" id="maint-location" placeholder="สถานที่ / อาคาร / เลขห้อง" class="p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                            <input type="text" id="maint-teacher" placeholder="ครูผู้รับผิดชอบห้อง/อุปกรณ์" class="p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <textarea id="maint-detail" rows="2" placeholder="รายละเอียดอาการชำรุด..." class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 mb-3"></textarea>
                        <button onclick="window.addMaintenance()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold flex items-center gap-1">
                            <i data-lucide="send" class="w-4 h-4"></i> ส่งรายการแจ้งซ่อม
                        </button>
                    </div>

                    <div class="space-y-3">
                        <h4 class="font-bold text-slate-800">รายการแจ้งซ่อมล่าสุด</h4>
                        ${dbState.maintenance.map(item => `
                            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                                <div class="space-y-1">
                                    <div class="flex items-center gap-2">
                                        <span class="font-bold text-slate-800 text-base">${item.title}</span>
                                        <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${item.status === 'ซ่อมเสร็จแล้ว' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                                            ${item.status}
                                        </span>
                                    </div>
                                    <div class="text-xs text-slate-700 font-medium">📍 <strong>สถานที่/ห้อง:</strong> ${item.location} \vert{} 👨‍🏫 <strong>ครูผู้รับผิดชอบ:</strong> ${item.teacherInCharge || 'ไม่ได้ระบุ'}</div>
                                    <p class="text-xs text-slate-600">📝 <strong>รายละเอียด:</strong> ${item.detail}</p>
                                    <div class="text-xs text-slate-400">👤 แจ้งโดย: ${item.reporter} \vert{} วันที่: ${item.date}</div>
                                </div>
                                ${canManage && item.status !== 'ซ่อมเสร็จแล้ว' ? `
                                    <button onclick="window.markMaintenanceDone('${item.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg flex items-center gap-1 shrink-0">
                                        <i data-lucide="check" class="w-3.5 h-3.5"></i> ทำการซ่อมเรียบร้อย
                                    </button>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        };

        window.addMaintenance = function() {
            const title = document.getElementById('maint-title').value.trim();
            const location = document.getElementById('maint-location').value.trim();
            const teacher = document.getElementById('maint-teacher').value.trim();
            const detail = document.getElementById('maint-detail').value.trim();

            if (!title || !location) return alert('กรุณากรอกชื่ออุปกรณ์และสถานที่/เลขห้อง');

            const reporterName = loggedStudent ? `${loggedStudent.firstName} (${loggedStudent.classRoom})` : ROLE_NAMES[currentRole];
            const itemId = Date.now().toString();

            db.ref(`school_data/maintenance/${itemId}`).set({
                id: itemId,
                title,
                location,
                teacherInCharge: teacher || 'ไม่ได้ระบุ',
                detail: detail || 'ไม่มีรายละเอียดเพิ่มเติม',
                reporter: reporterName,
                status: 'รอดำเนินการ',
                date: new Date().toISOString().split('T')[0]
            });
        };

        window.markMaintenanceDone = function(id) {
            db.ref(`school_data/maintenance/${id}/status`).set('ซ่อมเสร็จแล้ว');
        };

        // Initialize App & Listeners
        document.addEventListener('DOMContentLoaded', () => {
            initRealtimeListeners();
            window.initApp();
        });
    </script>
</body>
</html>
